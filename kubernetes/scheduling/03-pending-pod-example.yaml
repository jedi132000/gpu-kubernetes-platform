# Intentional scheduling-failure example.
#
# Requests more GPUs than any single node provides (8), so the pod stays
# Pending with an "Insufficient nvidia.com/gpu" event. Use it to practice the
# pending-pod diagnostic flow:
#
#   kubectl -n gpu-workloads describe pod -l app.kubernetes.io/name=gpu-oversized
#   # -> Events: 0/N nodes are available: N Insufficient nvidia.com/gpu
#   gpuctl preflight            # reports the pending-gpu-pods warning
#
# Delete it once you have observed the behaviour:
#   kubectl -n gpu-workloads delete pod gpu-oversized-request
apiVersion: v1
kind: Pod
metadata:
  name: gpu-oversized-request
  namespace: gpu-workloads
  labels:
    app.kubernetes.io/name: gpu-oversized
    app.kubernetes.io/part-of: gpu-kubernetes-platform
spec:
  restartPolicy: Never
  priorityClassName: gpu-batch-low
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c", "echo should-not-start; sleep 3600"]
      resources:
        limits:
          # Deliberately unsatisfiable on g5.xlarge (1 GPU/node).
          nvidia.com/gpu: "8"
