# CPU-only demonstration workload.
#
# Lets developers without GPU hardware exercise the scheduling model (quotas,
# priority classes, placement) on any cluster, including kind/minikube. It does
# NOT request nvidia.com/gpu and explicitly avoids GPU nodes so it never
# consumes accelerator capacity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-demo
  namespace: gpu-workloads
  labels:
    app.kubernetes.io/name: cpu-demo
    app.kubernetes.io/part-of: gpu-kubernetes-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cpu-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpu-demo
    spec:
      # Keep this off GPU nodes: do not tolerate the GPU taint, and prefer
      # nodes without the GPU-present label.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: NotIn
                    values: ["true"]
      containers:
        - name: app
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
